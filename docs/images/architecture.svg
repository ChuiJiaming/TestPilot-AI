<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect width="1200" height="780" fill="#FFFFFF"/>
  <text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">TestPilot AI · 平台总体架构</text>
  <text x="600" y="68" text-anchor="middle" font-size="13" fill="#64748B">四条纵向边界，物理分离部署 —— 把 AI 放在「建议位」，把裁判权留在「确定性」手里</text>

  <!-- Nginx 顶栏 -->
  <rect x="90" y="92" width="1020" height="46" rx="10" fill="#0F172A"/>
  <text x="600" y="121" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Nginx　·　TLS 终止　·　静态资源　·　SSE 反代（buffer-off）　·　Gateway mTLS 反代</text>

  <!-- Web -->
  <g>
    <rect x="90" y="170" width="220" height="150" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect x="90" y="170" width="220" height="36" rx="12" fill="#2563EB"/>
    <rect x="90" y="194" width="220" height="12" fill="#2563EB"/>
    <text x="200" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Web 控制台</text>
    <text x="108" y="232" font-size="12.5" fill="#1E3A8A">React 18 · TypeScript · Vite</text>
    <text x="108" y="254" font-size="12.5" fill="#1E3A8A">组织 / 项目 / 成员管理</text>
    <text x="108" y="276" font-size="12.5" fill="#1E3A8A">用例 · 运行 · 报告工作台</text>
    <text x="108" y="298" font-size="12.5" fill="#1E3A8A">SSE 实时事件流</text>
  </g>

  <!-- API -->
  <g>
    <rect x="400" y="170" width="260" height="190" rx="12" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
    <rect x="400" y="170" width="260" height="36" rx="12" fill="#EA580C"/>
    <rect x="400" y="194" width="260" height="12" fill="#EA580C"/>
    <text x="530" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">业务 API（FastAPI）</text>
    <text x="418" y="232" font-size="12.5" fill="#7C2D12">租户隔离：组织 → 项目 → 成员</text>
    <text x="418" y="254" font-size="12.5" fill="#7C2D12">三级 RBAC，跨租户一律拒绝</text>
    <text x="418" y="276" font-size="12.5" fill="#7C2D12">用例版本审批 / 双人审批</text>
    <text x="418" y="298" font-size="12.5" fill="#7C2D12">Run 服务 · 报告快照与导出</text>
    <text x="418" y="320" font-size="12.5" fill="#7C2D12">Outbox 事务性投递</text>
    <text x="418" y="342" font-size="12.5" fill="#7C2D12">哈希链式审计日志</text>
  </g>

  <!-- Agent Worker -->
  <g>
    <rect x="400" y="400" width="260" height="150" rx="12" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
    <rect x="400" y="400" width="260" height="36" rx="12" fill="#7C3AED"/>
    <rect x="400" y="424" width="260" height="12" fill="#7C3AED"/>
    <text x="530" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Agent Worker + Beat</text>
    <text x="418" y="462" font-size="12.5" fill="#4C1D95">LangGraph 有界规划 / 探索</text>
    <text x="418" y="484" font-size="12.5" fill="#4C1D95">预算闸门 · 超时即停</text>
    <text x="418" y="506" font-size="12.5" fill="#4C1D95">Celery 异步任务与定时调度</text>
    <text x="418" y="528" font-size="12.5" fill="#4C1D95">租约 · 心跳 · 过期回收</text>
  </g>

  <!-- Browser Gateway -->
  <g>
    <rect x="760" y="170" width="350" height="110" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="760" y="170" width="350" height="36" rx="12" fill="#475569"/>
    <rect x="760" y="194" width="350" height="12" fill="#475569"/>
    <text x="935" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Browser Gateway（mTLS 网关）</text>
    <text x="778" y="232" font-size="12.5" fill="#334155">API / Agent 与浏览器之间的唯一通道</text>
    <text x="778" y="254" font-size="12.5" fill="#334155">证书双向校验 · Worker 就绪汇聚</text>
  </g>

  <!-- Browser Worker -->
  <g>
    <rect x="760" y="330" width="350" height="150" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <rect x="760" y="330" width="350" height="36" rx="12" fill="#059669"/>
    <rect x="760" y="354" width="350" height="12" fill="#059669"/>
    <text x="935" y="354" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Browser Worker（Docker 隔离）</text>
    <text x="778" y="392" font-size="12.5" fill="#065F46">独立 Playwright 运行时，与业务 API 物理隔离</text>
    <text x="778" y="414" font-size="12.5" fill="#065F46">DNS 固定 + 默认拒绝的出口 ACL</text>
    <text x="778" y="436" font-size="12.5" fill="#065F46">非 root · 只读文件系统 · cap_drop ALL</text>
    <text x="778" y="458" font-size="12.5" fill="#065F46">截图 / trace / HAR 证据落盘</text>
  </g>

  <!-- 基础设施 -->
  <g font-size="12.5">
    <rect x="90" y="600" width="245" height="76" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="212" y="630" text-anchor="middle" font-weight="700" fill="#0F172A">PostgreSQL 18</text>
    <text x="212" y="652" text-anchor="middle" fill="#64748B">业务状态 · 事件 · Outbox</text>
    <rect x="360" y="600" width="245" height="76" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="482" y="630" text-anchor="middle" font-weight="700" fill="#0F172A">Redis</text>
    <text x="482" y="652" text-anchor="middle" fill="#64748B">Celery Broker · 限流</text>
    <rect x="630" y="600" width="245" height="76" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="752" y="630" text-anchor="middle" font-weight="700" fill="#0F172A">S3 / MinIO</text>
    <text x="752" y="652" text-anchor="middle" fill="#64748B">截图 · trace · HAR · 报告 artifact</text>
    <rect x="900" y="600" width="210" height="76" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="1005" y="630" text-anchor="middle" font-weight="700" fill="#0F172A">SMTP</text>
    <text x="1005" y="652" text-anchor="middle" fill="#64748B">邮箱验证 · 邮件 Outbox</text>
  </g>

  <!-- 箭头 -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#EA580C"/>
    </marker>
  </defs>
  <line x1="200" y1="316" x2="200" y2="92" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)" transform="rotate(180 200 204)" display="none"/>
  <line x1="310" y1="245" x2="400" y2="245" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="355" y="236" text-anchor="middle" font-size="11.5" fill="#64748B">HTTPS</text>
  <line x1="530" y1="360" x2="530" y2="400" stroke="#EA580C" stroke-width="1.8" marker-end="url(#arrO)"/>
  <text x="610" y="386" font-size="11.5" fill="#EA580C">Outbox → Celery</text>
  <polyline points="660,430 700,430 700,230 760,230" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="712" y="336" font-size="11.5" fill="#64748B" transform="rotate(-90 712 336)">mTLS</text>
  <line x1="935" y1="280" x2="935" y2="330" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="935" y1="480" x2="935" y2="600" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)" stroke-dasharray="5 4"/>
  <text x="985" y="546" font-size="11.5" fill="#64748B">证据落盘 SHA-256</text>
  <line x1="440" y1="360" x2="290" y2="600" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="530" y1="360" x2="530" y2="600" stroke="#475569" stroke-width="0" />
  <line x1="560" y1="550" x2="560" y2="600" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <text x="600" y="726" text-anchor="middle" font-size="12.5" fill="#94A3B8">浏览器是最不可信的一环 —— 因此 Worker 与业务 API 物理隔离，出口受 ACL 约束</text>
  <text x="600" y="750" text-anchor="middle" font-size="12.5" fill="#94A3B8">AI 不能改写断言，PASS / FAIL 的判定权永远在确定性执行器手里</text>
</svg>
