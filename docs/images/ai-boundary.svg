<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">AI 建议位 × 确定性判定 · 职责边界</text>
  <text x="600" y="68" text-anchor="middle" font-size="13" fill="#64748B">LLM 输出不可复现 —— 判定一旦依赖 LLM，测试就失去意义</text>

  <!-- 左：AI 建议位 -->
  <g>
    <rect x="90" y="100" width="420" height="330" rx="14" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
    <rect x="90" y="100" width="420" height="48" rx="14" fill="#7C3AED"/>
    <rect x="90" y="124" width="420" height="24" fill="#7C3AED"/>
    <text x="300" y="131" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">AI Agent —— 只在建议位</text>
    <g font-size="13" fill="#4C1D95">
      <rect x="118" y="172" width="364" height="52" rx="9" fill="#FFFFFF" stroke="#E9D5FF"/>
      <text x="136" y="194" font-weight="700">场景生成（M04）</text>
      <text x="136" y="213" font-size="11.5" fill="#7E22CE">AI 起草用例更像样，但必须经人工审核才能成为可运行版本</text>
      <rect x="118" y="236" width="364" height="52" rx="9" fill="#FFFFFF" stroke="#E9D5FF"/>
      <text x="136" y="258" font-weight="700">页面观察归纳（M07）</text>
      <text x="136" y="277" font-size="11.5" fill="#7E22CE">有界规划器在预算内探索页面，超预算立即停止模型调用</text>
      <rect x="118" y="300" width="364" height="52" rx="9" fill="#FFFFFF" stroke="#E9D5FF"/>
      <text x="136" y="322" font-weight="700">定位器恢复候选（M10）</text>
      <text x="136" y="341" font-size="11.5" fill="#7E22CE">AI 给出候选，人工逐条审批，拒绝 / 过期绝不生效</text>
      <rect x="118" y="364" width="364" height="52" rx="9" fill="#FFFFFF" stroke="#E9D5FF"/>
      <text x="136" y="386" font-weight="700">失败原因解释（M11）</text>
      <text x="136" y="405" font-size="11.5" fill="#7E22CE">AI 在证据约束下解释失败，脱敏假设，指纹归组仍由确定性规则完成</text>
    </g>
  </g>

  <!-- 中间红线 -->
  <rect x="536" y="100" width="128" height="330" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <text x="600" y="150" text-anchor="middle" font-size="30">🚫</text>
  <text x="600" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#B91C1C">技术红线</text>
  <g font-size="12" fill="#DC2626" text-anchor="middle">
    <text x="600" y="232">AI 不能改写断言</text>
    <text x="600" y="256">AI 不能跳过断言</text>
    <text x="600" y="280">AI 不能把一次</text>
    <text x="600" y="300">执行说成通过</text>
  </g>
  <line x1="560" y1="326" x2="640" y2="326" stroke="#EF4444" stroke-width="2"/>
  <text x="600" y="356" text-anchor="middle" font-size="12" fill="#B91C1C">审批一律双人</text>
  <text x="600" y="378" text-anchor="middle" font-size="12" fill="#B91C1C">职责分离强制</text>
  <text x="600" y="412" text-anchor="middle" font-size="11" fill="#EF4444">哈希链审计 · 篡改可检测</text>

  <!-- 右：确定性执行器 -->
  <g>
    <rect x="690" y="100" width="420" height="330" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <rect x="690" y="100" width="420" height="48" rx="14" fill="#059669"/>
    <rect x="690" y="124" width="420" height="24" fill="#059669"/>
    <text x="900" y="131" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">确定性执行器 —— 裁判权在这里</text>
    <g font-size="13" fill="#065F46">
      <rect x="718" y="172" width="364" height="52" rx="9" fill="#FFFFFF" stroke="#A7F3D0"/>
      <text x="736" y="194" font-weight="700">DSL v2 严格执行</text>
      <text x="736" y="213" font-size="11.5" fill="#047857">同一步骤、同一环境，永远得到同一结果</text>
      <rect x="718" y="236" width="364" height="52" rx="9" fill="#FFFFFF" stroke="#A7F3D0"/>
      <text x="736" y="258" font-weight="700">断言引擎判定 PASS / FAIL</text>
      <text x="736" y="277" font-size="11.5" fill="#047857">已发布断言是唯一判定依据，历史不可变</text>
      <rect x="718" y="300" width="364" height="52" rx="9" fill="#FFFFFF" stroke="#A7F3D0"/>
      <text x="736" y="322" font-weight="700">不可变测试资产（M05）</text>
      <text x="736" y="341" font-size="11.5" fill="#047857">版本审批发布即冻结，回滚只能新建版本</text>
      <rect x="718" y="364" width="364" height="52" rx="9" fill="#FFFFFF" stroke="#A7F3D0"/>
      <text x="736" y="386" font-weight="700">可校验证据链（M13）</text>
      <text x="736" y="405" font-size="11.5" fill="#047857">截图 / 报告带 SHA-256，字节级回读可验证</text>
    </g>
  </g>

  <text x="600" y="474" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0F172A">一句话概括：用例由 AI 起草，观察由 AI 归纳，解释由 AI 给出 —— 但 PASS / FAIL 的判定权，永远交还给确定性执行器。</text>
</svg>
