<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Run 执行骨干 · 异步流水线</text>
  <text x="600" y="68" text-anchor="middle" font-size="13" fill="#64748B">Outbox + 租约 + Reconciler：任务不漏发、不重复、不越权写入</text>

  <defs>
    <marker id="fa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#EA580C"/>
    </marker>
  </defs>

  <!-- 泳道 1：API -->
  <text x="60" y="92" font-size="13" font-weight="700" fill="#EA580C">业务 API</text>
  <g>
    <rect x="130" y="100" width="180" height="72" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
    <text x="220" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#7C2D12">创建 Run</text>
    <text x="220" y="152" text-anchor="middle" font-size="11.5" fill="#9A3412">幂等键 · 环境快照固定</text>

    <rect x="370" y="100" width="180" height="72" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
    <text x="460" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#7C2D12">Outbox 事件</text>
    <text x="460" y="152" text-anchor="middle" font-size="11.5" fill="#9A3412">与业务事务同源提交</text>

    <rect x="610" y="100" width="180" height="72" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
    <text x="700" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#7C2D12">状态机准入</text>
    <text x="700" y="152" text-anchor="middle" font-size="11.5" fill="#9A3412">QUEUED → PREPARING</text>

    <rect x="850" y="100" width="220" height="72" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
    <text x="960" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#7C2D12">SSE 实时事件流</text>
    <text x="960" y="152" text-anchor="middle" font-size="11.5" fill="#9A3412">一次性票据 + Cookie，断线可回放</text>
  </g>
  <line x1="310" y1="136" x2="370" y2="136" stroke="#EA580C" stroke-width="1.8" marker-end="url(#fa)"/>
  <line x1="550" y1="136" x2="610" y2="136" stroke="#EA580C" stroke-width="1.8" marker-end="url(#fa)"/>
  <line x1="790" y1="136" x2="850" y2="136" stroke="#EA580C" stroke-width="1.8" marker-end="url(#fa)"/>

  <!-- 泳道 2：Worker -->
  <text x="60" y="232" font-size="13" font-weight="700" fill="#7C3AED">Agent Worker</text>
  <g>
    <rect x="130" y="240" width="180" height="72" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
    <text x="220" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">领取租约</text>
    <text x="220" y="292" text-anchor="middle" font-size="11.5" fill="#6D28D9">心跳保活 · 过期回收</text>

    <rect x="370" y="240" width="180" height="72" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
    <text x="460" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">浏览器矩阵展开</text>
    <text x="460" y="292" text-anchor="middle" font-size="11.5" fill="#6D28D9">每矩阵一份 RunCase</text>

    <rect x="610" y="240" width="180" height="72" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
    <text x="700" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">AI 有界规划</text>
    <text x="700" y="292" text-anchor="middle" font-size="11.5" fill="#6D28D9">预算闸门 · 超时即停</text>

    <rect x="850" y="240" width="220" height="72" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
    <text x="960" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">mTLS 下发动作</text>
    <text x="960" y="292" text-anchor="middle" font-size="11.5" fill="#6D28D9">仅经 Gateway，证书双向校验</text>
  </g>
  <line x1="310" y1="276" x2="370" y2="276" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#fa)"/>
  <line x1="550" y1="276" x2="610" y2="276" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#fa)"/>
  <line x1="790" y1="276" x2="850" y2="276" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#fa)"/>

  <!-- 泳道 3：Browser Worker -->
  <text x="60" y="372" font-size="13" font-weight="700" fill="#059669">Browser Worker</text>
  <g>
    <rect x="130" y="380" width="180" height="72" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="220" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">Playwright 执行</text>
    <text x="220" y="432" text-anchor="middle" font-size="11.5" fill="#047857">出口 ACL · DNS 固定</text>

    <rect x="370" y="380" width="180" height="72" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="460" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">截图 / trace / HAR</text>
    <text x="460" y="432" text-anchor="middle" font-size="11.5" fill="#047857">证据逐字节落盘</text>

    <rect x="610" y="380" width="180" height="72" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="700" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">确定性断言引擎</text>
    <text x="700" y="432" text-anchor="middle" font-size="11.5" fill="#047857">PASS / FAIL 由断言决定</text>

    <rect x="850" y="380" width="220" height="72" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="960" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">证据写入 S3</text>
    <text x="960" y="432" text-anchor="middle" font-size="11.5" fill="#047857">SHA-256 入库，字节级可回读</text>
  </g>
  <line x1="310" y1="416" x2="370" y2="416" stroke="#059669" stroke-width="1.8" marker-end="url(#fa)"/>
  <line x1="550" y1="416" x2="610" y2="416" stroke="#059669" stroke-width="1.8" marker-end="url(#fa)"/>
  <line x1="790" y1="416" x2="850" y2="416" stroke="#059669" stroke-width="1.8" marker-end="url(#fa)"/>

  <!-- 泳道 4：报告 -->
  <text x="60" y="504" font-size="13" font-weight="700" fill="#0F172A">报告与集成</text>
  <g font-size="11.5">
    <rect x="130" y="512" width="220" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="240" y="538" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">报告快照（终态 Run）</text>
    <text x="240" y="558" text-anchor="middle" fill="#64748B">基于持久化 Run 事实生成</text>
    <rect x="390" y="512" width="220" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="500" y="538" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">四格式导出</text>
    <text x="500" y="558" text-anchor="middle" fill="#64748B">HTML · PDF · JSON · JUnit</text>
    <rect x="650" y="512" width="220" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="760" y="538" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">下载重鉴权</text>
    <text x="760" y="558" text-anchor="middle" fill="#64748B">导出 artifact 带授权校验</text>
    <rect x="910" y="512" width="160" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="990" y="538" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">CI / Webhook</text>
    <text x="990" y="558" text-anchor="middle" fill="#64748B">幂等触发 · 签名校验</text>
  </g>
  <line x1="960" y1="452" x2="960" y2="512" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#fa)"/>
  <line x1="850" y1="542" x2="910" y2="542" stroke="#475569" stroke-width="0"/>

  <text x="600" y="614" text-anchor="middle" font-size="12.5" fill="#94A3B8">每个环节都有持久化账本：Outbox 事件 · 租约 · 步骤事实 · artifact 哈希链，任何一环宕机都可恢复、可对账</text>
</svg>
