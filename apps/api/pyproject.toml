[project]
name = "testpilot-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "psycopg[binary]>=3.2,<4",
    "PyJWT>=2.8,<3",
    "cryptography>=44,<47",
    "pwdlib[argon2]>=0.2,<1",
    "redis>=5,<7",
    "celery[redis]>=5.6,<6",
    "croniter>=6,<7",
    "langchain-openai>=1,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "PyYAML>=6,<7",
]

