name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: "1"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TESTPILOT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testpilot
      TESTPILOT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          # constraints.txt is the reproducible build; pyproject ranges are not.
          python -m pip install -e "apps/api[test]" -c apps/api/constraints.txt
      - name: Run test suite
        run: python -m pytest tests -q -rs

  migrations:
    name: Migration chain on a clean database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testpilot_mig
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TESTPILOT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testpilot_mig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e "apps/api" -c apps/api/constraints.txt
      - name: Apply every migration from scratch
        run: python -m apps.api.scripts.migrate --apply
      - name: Verify ledger hashes
        run: python -m apps.api.scripts.migrate --check
      - name: Detect ORM / migration drift
        run: python -m apps.api.scripts.check_schema_drift

  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
