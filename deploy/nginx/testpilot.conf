# TestPilot AI — Nginx TLS termination, static assets, API reverse proxy, SSE
#
# Responsibilities:
#   - TLS termination for the public web/API surface
#   - Serve the built React SPA and its hashed assets
#   - Reverse-proxy /api and /api/v1 to the FastAPI app (127.0.0.1:8000)
#   - Long-lived, buffered-off upstream for Server-Sent Events (Run Console)
#   - Gateway access for browser-session and healing endpoints via mTLS
#
# This is the SPA + API front door. It is NOT the browser egress path: browser
# traffic leaves through the isolated Worker's dedicated, DNS-pinned subnet and
# never transits this vhost.

# ---------------------------------------------------------------------------
# Rate limiting (shared by the SPA/API vhost)
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=tp_auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=tp_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name testpilot.example.com;  # replace with the real hostname

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name testpilot.example.com;  # replace with the real hostname

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/testpilot/tls/server.crt;
    ssl_certificate_key /etc/testpilot/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Headers -----------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 16m;
    limit_conn tp_conn 32;

    # --- Static SPA --------------------------------------------------------
    root /srv/testpilot/apps/web/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- API reverse proxy -------------------------------------------------
    # Auth and token endpoints are rate-limited more tightly.
    location ~ ^/api/v1/(auth|api-tokens|invitations)(/|$) {
        limit_req zone=tp_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- SSE (Run Console / events) ----------------------------------------
    # SSE requires response buffering off, a long read timeout, and
    # chunked framing so the event stream reaches the browser incrementally.
    location ~ ^/api/v1/(test-runs|events|sse-tickets) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # --- Browser Gateway (mTLS hop) ----------------------------------------
    # The public API never reaches the Worker directly. Gateway endpoints are
    # proxied with the API's client certificate so the Gateway can authenticate
    # the caller over its own mTLS chain.
    location ~ ^/api/v1/(browser-sessions|healing-records)/ {
        proxy_pass https://127.0.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_certificate         /etc/testpilot/tls/api-client.crt;
        proxy_ssl_certificate_key     /etc/testpilot/tls/api-client.key;
        proxy_ssl_trusted_certificate /etc/testpilot/tls/gateway-server-ca.crt;
        proxy_ssl_verify on;
        proxy_read_timeout 120s;
    }

    # --- SPA fallback ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
